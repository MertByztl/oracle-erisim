<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hermes — Geçici Sohbet</title>
<style>
  :root{--bg:#0b1220;--panel:#121b2e;--panel2:#0f1829;--line:#243150;--fg:#e7eefc;--dim:#8ba0c4;--ok:#35d07f;--off:#ff6b6b;--accent:#2f81f7;--me:#2f5ba8}
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;display:flex;flex-direction:column;max-width:720px;margin:0 auto}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
  header h1{font-size:17px;margin:0}
  .meta{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .chip{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:3px 11px;font-size:12px}
  .chip.time{color:#ffd27a;border-color:#8a5a00;font-variant-numeric:tabular-nums}
  #chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:10px}
  .b{max-width:82%;padding:10px 13px;border-radius:14px;font-size:14px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
  .b.h{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-bottom-left-radius:5px}
  .b.me{align-self:flex-end;background:var(--me);border-bottom-right-radius:5px}
  .b.sys{align-self:center;background:transparent;color:var(--dim);font-size:12px;text-align:center;max-width:95%}
  .typing{color:var(--dim);font-size:13px}
  footer{padding:10px 12px;border-top:1px solid var(--line);display:flex;gap:8px}
  textarea{flex:1;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;resize:none;font-family:inherit}
  button{background:var(--accent);color:#fff;border:0;border-radius:10px;padding:10px 18px;font-size:14px;font-weight:600;cursor:pointer}
  button:disabled{opacity:.5;cursor:default}
  #gate{margin:auto;text-align:center;color:var(--dim);padding:40px 20px;max-width:360px}
  #gate .big{font-size:34px}
  #gate input{width:100%;background:var(--panel2);color:var(--fg);border:1px solid var(--line);border-radius:10px;padding:11px;font-size:15px;margin:12px 0}
  #gate button{width:100%}
  #reqstatus{margin-top:14px;font-size:13px}
</style>
</head>
<body>
<header>
  <h1>🤖 Hermes</h1>
  <span class="chip">Geçici Sohbet</span>
  <div class="meta" id="meta" style="display:none">
    <span class="chip" id="who"></span>
    <span class="chip time" id="kalan">—</span>
  </div>
</header>

<div id="gate">
  <div class="big">🔑</div>
  <p>Hermes ile sohbet için Mert'ten <b>geçici erişim</b> iste.</p>
  <input id="reqname" maxlength="40" placeholder="Adın ne?">
  <button id="reqbtn" onclick="requestAccess()">Erişim İste</button>
  <div id="reqstatus"></div>
</div>

<div id="chat" style="display:none"></div>
<footer id="bar" style="display:none">
  <textarea id="in" rows="1" placeholder="Hermes'e yaz…"
    onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();send();}"></textarea>
  <button id="go" onclick="send()">Gönder</button>
</footer>

<script>
const API = location.origin;
let TOKEN = (location.hash.match(/t=([^&]+)/)||[])[1] || "";
const $ = s => document.querySelector(s);
let EXP = 0, busy = false, pollTimer = null;

function hdr(){ return {headers:{Authorization:"Bearer "+TOKEN,"Content-Type":"application/json"}}; }
function bubble(who,text){ const d=document.createElement("div"); d.className="b "+who; d.textContent=text; $("#chat").appendChild(d); $("#chat").scrollTop=1e9; return d; }
function sys(text){ const d=document.createElement("div"); d.className="b sys"; d.textContent=text; $("#chat").appendChild(d); $("#chat").scrollTop=1e9; }
function fmt(s){ s=Math.max(0,s|0); const h=s/3600|0,m=(s%3600)/60|0,x=s%60; return (h?h+"s ":"")+m+"dk "+x+"sn"; }
function tick(){ const k=Math.max(0,EXP-Date.now()/1000|0); $("#kalan").textContent="⏳ "+fmt(k);
  if(k<=0){ $("#kalan").textContent="⏳ süre doldu"; $("#in").disabled=true; $("#go").disabled=true; sys("Süre doldu — erişim kapandı. Yeni erişim için Mert'ten iste."); } }
async function j(u,o){ const r=await fetch(u,o); if(!r.ok){throw new Error((await r.json().catch(()=>({}))).detail||("HTTP "+r.status));} return r.json(); }

// ---- misafir: erişim iste + bekle ----
async function requestAccess(){
  const name = $("#reqname").value.trim();
  if(!name){ $("#reqstatus").textContent="Önce adını yaz."; return; }
  $("#reqbtn").disabled=true; $("#reqname").disabled=true;
  $("#reqstatus").textContent="İstek gönderildi. Mert onaylayınca otomatik açılacak…";
  try{
    const r = await j(API+"/api/request", {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify({name})});
    const rid = r.request_id;
    pollTimer = setInterval(async()=>{
      try{
        const p = await j(API+"/api/poll?request_id="+encodeURIComponent(rid));
        if(p.status==="approved" && p.token){ clearInterval(pollTimer); TOKEN=p.token; location.hash="t="+TOKEN; startChat(); }
        else if(p.status==="denied"){ clearInterval(pollTimer); $("#reqstatus").textContent="İstek reddedildi."; $("#reqbtn").disabled=false; $("#reqname").disabled=false; }
      }catch(e){}
    }, 2000);
  }catch(e){ $("#reqstatus").textContent="Hata: "+e.message; $("#reqbtn").disabled=false; $("#reqname").disabled=false; }
}

// ---- sohbet ----
async function startChat(){
  try{
    const me = await j(API+"/api/me", hdr());
    EXP = me.exp;
    $("#gate").style.display="none"; $("#chat").style.display="flex"; $("#bar").style.display="flex"; $("#meta").style.display="flex";
    $("#who").textContent = "👤 "+me.name;
    setInterval(tick,1000); tick();
    const hi = await j(API+"/api/hello", hdr());
    bubble("h", hi.text || "Selam!");
  }catch(e){ $("#gate").style.display="block"; }
}

async function send(){
  if(busy) return;
  const t = $("#in").value.trim(); if(!t) return;
  $("#in").value=""; bubble("me", t); busy=true; $("#go").disabled=true;
  const tp = bubble("h",""); tp.innerHTML='<span class="typing">Hermes yazıyor…</span>';
  try{ const r = await j(API+"/api/chat", {method:"POST", ...hdr(), body:JSON.stringify({message:t})}); tp.textContent=r.reply||"(boş)"; }
  catch(e){ tp.textContent="⚠ "+e.message; }
  busy=false; $("#go").disabled=false; $("#in").focus();
}

if(TOKEN) startChat();
</script>
</body>
</html>
